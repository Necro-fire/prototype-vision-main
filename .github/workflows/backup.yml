name: Cópia de segurança do banco

# Toda semana (domingo, 3h em Brasília) e quando você mandar rodar pela aba Actions.
# Precisa de dois segredos no GitHub (Settings > Secrets and variables > Actions), descritos em
# docs/08-publicacao.md: BACKUP_DB_URL e BACKUP_PASSPHRASE. Sem eles, esta rotina falha e o GitHub
# avisa por e-mail; nada é gravado.
on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copia:
    runs-on: ubuntu-latest
    env:
      BACKUP_DB_URL: ${{ secrets.BACKUP_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Conferir os segredos
        run: |
          if [ -z "$BACKUP_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error title=Faltam segredos::Cadastre BACKUP_DB_URL e BACKUP_PASSPHRASE (docs/08-publicacao.md)."
            exit 1
          fi

      # O pg_dump precisa ser da mesma versão do banco do Supabase (17) ou mais nova.
      - name: Instalar o cliente do Postgres 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      # As contas (auth) e os dados da barbearia (public). Os arquivos das fotos ficam no Storage e
      # não vão nesta cópia: se um dia se perderem, é só enviar de novo pelo painel.
      - name: Copiar o banco
        run: |
          pg_dump "$BACKUP_DB_URL" --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth --file=banco.dump
          test -s banco.dump

      # A cópia tem nomes, e-mails e telefones de clientes: sai cifrada, nunca em texto aberto.
      - name: Cifrar
        run: |
          printf %s "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 --output "onstyle-$(date -u +%Y-%m-%d).dump.gpg" banco.dump
          rm banco.dump
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: banco-cifrado
          path: onstyle-*.dump.gpg
          retention-days: 90
          if-no-files-found: error
